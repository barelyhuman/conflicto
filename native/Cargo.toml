[workspace]
resolver = "2"
members = ["conflicto", "conflicto_core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
conflicto_core = { path = "conflicto_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
rfd = "0.15"
similar = "2"
eframe = { version = "0.31", default-features = true }
egui = "0.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
